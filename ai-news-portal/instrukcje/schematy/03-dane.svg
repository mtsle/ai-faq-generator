<rect x="40" y="130" width="480" height="190" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<text x="280.0" y="186.5" font-size="12.5" font-weight="700" fill="#4C1D95" text-anchor="middle">wp_ainp_items — kolejka materiałów</text>
<text x="280.0" y="203.5" font-size="11.5" font-weight="400" fill="#4C1D95" text-anchor="middle">id · url (2048) · url_hash UNIQUE</text>
<text x="280.0" y="220.5" font-size="11.5" font-weight="400" fill="#4C1D95" text-anchor="middle">content_hash UNIQUE NULL · title · excerpt</text>
<text x="280.0" y="237.5" font-size="11.5" font-weight="400" fill="#4C1D95" text-anchor="middle">content (longtext) · status · note</text>
<text x="280.0" y="254.5" font-size="11.5" font-weight="400" fill="#4C1D95" text-anchor="middle">attempts · post_id · created_at · updated_at</text>
<text x="280.0" y="271.5" font-size="11.5" font-weight="400" fill="#4C1D95" text-anchor="middle">KEY (status, updated_at) · InnoDB</text>
<rect x="40" y="350" width="480" height="175" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
<text x="280.0" y="399.0" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="middle">Statusy pozycji</text>
<text x="280.0" y="416.0" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="middle">new — czeka</text>
<text x="280.0" y="433.0" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="middle">processing — w obróbce (TTL 900 s)</text>
<text x="280.0" y="450.0" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="middle">done — powstał artykuł</text>
<text x="280.0" y="467.0" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="middle">skipped — odrzucona świadomie</text>
<text x="280.0" y="484.0" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="middle">failed — próba nieudana, treść zostaje</text>
<rect x="40" y="550" width="480" height="80" rx="9" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
<text x="280.0" y="577.0" font-size="12.5" font-weight="700" fill="#7C2D12" text-anchor="middle">Dwa klucze UNIQUE = brak duplikatów</text>
<text x="280.0" y="594.0" font-size="11.5" font-weight="400" fill="#7C2D12" text-anchor="middle">content_hash dopuszcza NULL — pozycje</text>
<text x="280.0" y="611.0" font-size="11.5" font-weight="400" fill="#7C2D12" text-anchor="middle">przed doczytaniem treści nie kolidują</text>
