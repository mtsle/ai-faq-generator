<text x="805.0" y="180.5" font-size="11.5" font-weight="400" fill="#1E3A8A" text-anchor="middle">publiczny, w edytorze blokowym</text>
<text x="805.0" y="197.5" font-size="11.5" font-weight="400" fill="#1E3A8A" text-anchor="middle">BEZ własnej pozycji w menu kokpitu</text>
<text x="805.0" y="214.5" font-size="11.5" font-weight="400" fill="#1E3A8A" text-anchor="middle">archiwum: /centrum-wiedzy/</text>
