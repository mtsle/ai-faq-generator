<text x="515.0" y="188.5" font-size="11.5" font-weight="400" fill="#064E3B" text-anchor="middle">limity: feed 4 MB / art. 1 MB</text>
<text x="515.0" y="205.5" font-size="11.5" font-weight="400" fill="#064E3B" text-anchor="middle">timeouty: 10 s / 15 s</text>
